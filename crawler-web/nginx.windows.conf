server {
    listen 8091;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA（Vue Router history 模式）回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代到 crawler-admin。
    # 桥接网络下用服务名（Docker DNS），不再用 127.0.0.1（那是本容器自己）。
    # proxy_pass 不带结尾斜杠，保留原始 /api 前缀，匹配后端 /api/crawl/* 路由。
    location /api/ {
        proxy_pass http://crawler-admin:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 可选：xxl-job 管理界面反代（host.docker.internal = Docker Desktop 访问宿主机）
    location /xxl-job/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
